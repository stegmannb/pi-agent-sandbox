allowBuilds:
  '@google/genai': true
  koffi: true
  protobufjs: true
onlyBuiltDependencies:
  - "@google/genai"
  - koffi
  - protobufjs
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - glibc
    - musl
patchedDependencies:
  '@anthropic-ai/sandbox-runtime@0.0.52': patches/@anthropic-ai__sandbox-runtime@0.0.52.patch
  'oxfmt@0.33.0': patches/oxfmt@0.33.0.patch
  'oxlint@1.59.0': patches/oxlint@1.59.0.patch
